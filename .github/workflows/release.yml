name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validation:
    uses: ./.github/workflows/_validation.yml
    secrets: inherit
  
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pkg_version: ${{ steps.build.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.7
          enable-cache: false

      - name: Build
        id: build
        run: |
          uv build
          echo "pkg_version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
  
  # publish:
  #   name: Publish to PyPI
  #   runs-on: ubuntu-latest
  #   needs: [build, validation]
  #   environment:
  #     name: pypi
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: astral-sh/setup-uv@v10.0.1
  #       with:
  #         version: 0.12.7
  #         enable-cache: false

  #     - name: Download distributions artifact
  #       uses: actions/download-artifact@v8.0.1
  #       with:
  #         name: dist
  #         path: dist/

  #     - name: Generate PEP 740 attestations
  #       uses: astral-sh/attest-action@v0.0.6

  #     - name: Publish
  #       run: uv publish

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, validation]
    if: ${{ needs.build.outputs.pkg_version != '' }}
    permissions:
      contents: write
    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        env:
          pkg_version: ${{needs.build.outputs.pkg_version}}
        with:
          name: ${{ env.pkg_version }}
          tag: ${{ env.pkg_version }}
          commit: "main"
          draft: true
          artifacts: "dist/*"
          generateReleaseNotes: true
          makeLatest: true