name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/_validation.yml
    secrets: inherit

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [validation]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: 
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v9
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build package
        run: uv build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.PKG_VERSION }}
          tag: ${{ env.PKG_VERSION }}
          commit: "main"
          draft: false
          artifacts: "dist/*"
          generateReleaseNotes: true
          makeLatest: true