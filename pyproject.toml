[project]
name = "aiofilepool"
version = "0.1.0"
description = "Async file-descriptor pool: allows holding thousands of usable async file handles"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lia Va" }]
keywords = [
    "asyncio",
    "async",
    "file",
    "io",
    "file-descriptor",
    "pool",
    "chunked",
    "concurrency",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MiloLug/aiofilepool"
Repository = "https://github.com/MiloLug/aiofilepool"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis>=6.115.0",
    "mypy>=1.19.1",
    "ruff>=0.15.12",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiofilepool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: slow-running property/stress tests (deselect with '-m \"not slow\"')",
]
